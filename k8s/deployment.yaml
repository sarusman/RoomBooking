apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-service
spec:
  # Une seule instance : le stockage en mémoire n'est pas partagé.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: room-service
  template:
    metadata:
      labels:
        app: room-service
    spec:
      containers:
        - name: room-service
          image: sarusman/roombooking-room-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
